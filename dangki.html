<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Câu Lạc Bộ Thể Thao</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
        }
        .bg-header {
            background-color: #0d6efd;
        }
        .card-custom {
            border: none;
            box-shadow: 0 0 10px rgba(0,0,0,0.08);
            border-radius: 6px;
        }
        .form-label, .form-check-label {
            font-size: 0.875rem;
            color: #333;
        }
        .form-control, .form-select {
            font-size: 0.875rem;
        }
    </style>
</head>
<body class="d-flex flex-column min-vh-100">

    <header class="bg-header text-white text-center py-3 fs-4 fw-bold">
        Câu Lạc Bộ Thể Thao
    </header>

    <nav class="navbar navbar-expand navbar-dark bg-dark py-1">
        <div class="container-fluid px-3">
            <div class="navbar-nav fs-7">
                <a class="nav-link text-white-50 px-2" href="trangchu.html">Trang Chủ</a>
                <a class="nav-link active fw-bold text-white px-2" href="#">Đăng Ký Thành Viên</a>
                <a class="nav-link text-white-50 px-2" href="thanhvien.html">Xem Thành Viên</a>
            </div>
        </div>
    </nav>

    <main class="container my-4 flex-grow-1 d-flex justify-content-center align-items-start">
        <div class="card card-custom p-4 w-100" style="max-width: 520px;">
            <h5 class="text-danger text-center fw-bold mb-3">THÊM THÀNH VIÊN CÂU LẠC BỘ</h5>

            <form action="#" method="POST" enctype="multipart/form-data">
                <div class="mb-2">
                    <label for="hoten" class="form-label mb-1">Họ tên:</label>
                    <input type="text" class="form-control" id="hoten" placeholder="Nhập họ tên...">
                </div>

                <div class="mb-2">
                    <label for="txtmk" class="form-label mb-1">Mật khẩu:</label>
                    <input type="password" class="form-control" id="txtmk">
                </div>

                <div class="mb-2">
                    <label for="hinhanh" class="form-label mb-1">Chọn hình ảnh:</label>
                    <input type="file" class="form-control" id="hinhanh">
                </div>

                <div class="mb-2">
                    <label for="gioithieu" class="form-label mb-1">Giới thiệu bản thân:</label>
                    <textarea class="form-control" id="gioithieu" rows="4"></textarea>
                </div>

                <div class="mb-2">
                    <label class="form-label d-block mb-1">Giới tính:</label>
                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="radio" name="gioitinh" id="nam" value="Nam" checked>
                        <label class="form-check-label" for="nam">Nam</label>
                    </div>
                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="radio" name="gioitinh" id="nu" value="Nữ">
                        <label class="form-check-label" for="nu">Nữ</label>
                    </div>
                </div>

                <div class="mb-2">
                    <label class="form-label d-block mb-1">Sở thích:</label>
                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="checkbox" id="caulong" value="Cầu lông" checked>
                        <label class="form-check-label" for="caulong">Cầu lông</label>
                    </div>
                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="checkbox" id="dabong" value="Đá bóng">
                        <label class="form-check-label" for="dabong">Đá bóng</label>
                    </div>
                </div>

                <div class="mb-3">
                    <label for="tinh" class="form-label mb-1">Tỉnh/Thành phố</label>
                    <select class="form-select" id="tinh">
                        <option value="CaMau" selected>Cà Mau</option>
                        <option value="CanTho">Cần Thơ</option>
                        <option value="TPHCM">TP. Hồ Chí Minh</option>
                        <option value="HaNoi">Hà Nội</option>
                    </select>
                </div>

                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-primary btn-sm px-3">Xử lý</button>
                    <button type="reset" class="btn btn-danger btn-sm px-3">Hủy bỏ</button>
                </div>
            </form>
        </div>
    </main>

    <footer class="bg-dark text-white text-center py-3 fw-bold">
        Thể Thao
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
